name: Build & Sign Release (AAB & APK)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Version Code (increment by 1 for each Play Store update)'
        required: true
        default: '1'
      version_name:
        description: 'Version Name'
        required: true
        default: '1.0.0'
      store_password:
        description: 'Keystore Password (or set in GitHub Secrets)'
        required: false
        default: 'peerlink2026'
      key_password:
        description: 'Key Password (or set in GitHub Secrets)'
        required: false
        default: 'peerlink2026'
      key_alias:
        description: 'Key Alias'
        required: false
        default: 'upload'

permissions:
  contents: read

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.jvmargs=-Xmx4g
    -Dfile.encoding=UTF-8

jobs:
  build-and-sign:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android command line tools
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK 37
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER=""
          for candidate in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/22.0/bin/sdkmanager" \
            "$ANDROID_SDK_ROOT/cmdline-tools/22.0/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0" "platform-tools"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          echo "Android SDK 37.0 is ready."

      - name: Prepare Release Keystore
        shell: bash
        run: |
          set -euo pipefail

          STORE_PASS="${{ secrets.STORE_PASSWORD || inputs.store_password || 'peerlink2026' }}"
          KEY_PASS="${{ secrets.KEY_PASSWORD || inputs.key_password || 'peerlink2026' }}"
          KEY_ALIAS="${{ secrets.KEY_ALIAS || inputs.key_alias || 'upload' }}"

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Restoring keystore from GitHub Secret KEYSTORE_BASE64..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release-upload-key.jks
          elif [ -f release-upload-key.jks ]; then
            echo "Using existing release-upload-key.jks in root..."
          else
            echo "Generating new release upload keystore automatically..."
            keytool -genkey -v \
              -keystore release-upload-key.jks \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=PeerLink, OU=Personal, O=None, L=Nurpur, ST=WestBengal, C=IN"
          fi

          test -f release-upload-key.jks
          echo "Keystore is ready."

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Signed AAB (App Bundle) and APK
        shell: bash
        run: |
          set -euo pipefail

          STORE_PASS="${{ secrets.STORE_PASSWORD || inputs.store_password || 'peerlink2026' }}"
          KEY_PASS="${{ secrets.KEY_PASSWORD || inputs.key_password || 'peerlink2026' }}"
          KEY_ALIAS="${{ secrets.KEY_ALIAS || inputs.key_alias || 'upload' }}"
          V_CODE="${{ inputs.version_code || '1' }}"
          V_NAME="${{ inputs.version_name || '1.0.0' }}"

          export KEYSTORE_PATH="$(pwd)/release-upload-key.jks"
          export STORE_PASSWORD="$STORE_PASS"
          export KEY_ALIAS="$KEY_ALIAS"
          export KEY_PASSWORD="$KEY_PASS"
          export VERSION_CODE="$V_CODE"
          export VERSION_NAME="$V_NAME"

          echo "Building signed Release AAB and APK (Version $V_NAME, Code $V_CODE)..."
          ./gradlew clean :app:bundleRelease :app:assembleRelease --stacktrace --no-daemon

      - name: Verify Generated Outputs
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Generated AAB Bundle ==="
          ls -lh app/build/outputs/bundle/release/*.aab
          echo "=== Generated Release APK ==="
          ls -lh app/build/outputs/apk/release/*.apk

      - name: Upload Release AAB (For Google Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: peerlink-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK (For Device Testing)
        uses: actions/upload-artifact@v4
        with:
          name: peerlink-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Keystore Backup (Store Safely)
        uses: actions/upload-artifact@v4
        with:
          name: peerlink-upload-keystore
          path: release-upload-key.jks
          if-no-files-found: warn
          retention-days: 30