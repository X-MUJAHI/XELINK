name: Build Debug APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.jvmargs=-Xmx4g
    -Dfile.encoding=UTF-8

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android command line tools
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install required Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER=""

          for candidate in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/22.0/bin/sdkmanager" \
            "$ANDROID_SDK_ROOT/cmdline-tools/22.0/bin/sdkmanager"; do

            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo "Installing Android 37.0..."
          "$SDKMANAGER" "platforms;android-37.0"

          echo "Installing platform-tools..."
          "$SDKMANAGER" "platform-tools"

          echo "Installed Android platforms:"
          find "$ANDROID_HOME/platforms" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            -printf '%f\n' \
            | sort -V

          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"

          echo "Android SDK 37.0 is ready."

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/debug"

          APK="$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' | head -n 1 || true)"

          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: peerlink-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7