name: Android CI Build

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # The runner may have an Android SDK, but sdkmanager is not guaranteed
      # to be on PATH until the Android SDK action has configured it.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37 build-tools;35.0.0"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          command -v sdkmanager
          sdkmanager --list_installed | grep -E 'platforms;android-37|build-tools;35.0.0' || true

      - name: Prepare Keystore and Environment
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          touch .env
          if [ ! -f .env.example ]; then
            touch .env.example
          fi

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Show build environment
        run: |
          java -version
          ./gradlew --version

      - name: Clean build
        run: ./gradlew clean --no-daemon --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Verify APK exists
        run: |
          ls -lah app/build/outputs/apk/debug/
          test -n "$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: peerlink-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
