name: Android CI Build

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.jvmargs=-Xmx4g
    -Dfile.encoding=UTF-8

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platforms;android-37.0
            platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Verify Android SDK 37
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"

          test -d "${ANDROID_HOME}/platforms/android-37.0"
          test -f "${ANDROID_HOME}/platforms/android-37.0/android.jar"

          echo "Installed Android platforms:"
          find "${ANDROID_HOME}/platforms" \
            -maxdepth 1 \
            -mindepth 1 \
            -type d \
            -printf '%f\n' \
            | sort -V

          echo "Android 37.0 SDK is ready."

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean assembleDebug --stacktrace --no-daemon

      - name: Verify Debug APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="app/build/outputs/apk/debug"

          if ! find "${APK_DIR}" -maxdepth 1 -type f -name "*.apk" | grep -q .; then
            echo "ERROR: Debug APK was not produced."
            exit 1
          fi

          echo "Debug APK produced:"
          find "${APK_DIR}" \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: peerlink-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error